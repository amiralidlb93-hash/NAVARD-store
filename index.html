<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAVARD, shape before season</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Onest:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="root">
  <div class="picture" id="picture" aria-hidden="true"></div>

  <header class="top">
    <a class="mark" href="#" aria-label="NAVARD">NAVARD<span class="ring"></span></a>
    <nav class="nav" aria-label="Primary">
      <button data-open="atelier">Atelier</button>
      <button data-open="lines">Lines</button>
      <button data-open="notes">Notes</button>
      <span class="divider"></span>
      <button class="bag" data-open="bag" aria-label="Open bag">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="count" id="count" hidden>0</span>
      </button>
    </nav>
  </header>

  <main class="stage">
    <section class="display">
      <span class="br tl"></span>
      <h1>Shape<br>Before<br>Season
        <svg class="check" viewBox="0 0 12 12" aria-hidden="true"><rect x="0" y="0" width="4" height="4"/><rect x="8" y="0" width="4" height="4"/><rect x="4" y="4" width="4" height="4"/><rect x="0" y="8" width="4" height="4"/><rect x="8" y="8" width="4" height="4"/></svg>
      </h1>
      <span class="br bl"></span>
      <button class="cta" data-open="lines">
        <span>See the line</span>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12L12 4M5.5 4H12v6.5"/></svg>
      </button>
    </section>

    <figure class="still"><img src="https://wjwoitlioftohvwfymeq.supabase.co/storage/v1/object/public/designs/ossea/cloth-one-1.webp" alt="A finished wool coat against a studio wall" loading="lazy"></figure>

    <aside class="feature">
      <span class="br tl"></span><span class="br tr"></span><span class="br bl"></span><span class="br brr"></span>
      <svg class="globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><ellipse cx="12" cy="12" rx="4.2" ry="10"/><path d="M2 12h20M4 7h16M4 17h16"/></svg>
      <p>Past seasons.<br>Made to remain.</p>
    </aside>
  </main>
</div>

<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-labelledby="dTitle"></aside>
<div class="toast" id="toast" role="status" hidden></div>
<script src="script.js"></script>
</body>
</html>
